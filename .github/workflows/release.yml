name: Semantic Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    # 1. ADD THIS PERMISSIONS BLOCK HERE
    permissions:
      contents: write # This is the crucial line!
      issues: write # Recommended for creating/updating GitHub releases
      pull-requests: write # Recommended for creating/updating GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required for semantic-release/git to analyze history and commit/push back
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          # GITHUB_TOKEN is mandatory for this workflow
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
